<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d0d10;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(900px 500px at 15% 0%,rgba(88,101,242,.35),transparent 60%),radial-gradient(700px 500px at 100% 100%,rgba(88,101,242,.18),transparent 60%)}
.left{position:absolute;left:72px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;color:#f2f3f5}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:34px}
.brand img{width:76px;height:76px}
.brand b{font-size:44px;letter-spacing:-.02em}
h1{font-size:62px;line-height:1.02;margin:0 0 22px;letter-spacing:-.035em;font-weight:800}
h1 span{color:#7c86ff}
p{font-size:26px;line-height:1.35;color:#a3a6b0;margin:0}
.shot{position:absolute;left:600px;top:84px;width:860px;border-radius:16px;overflow:hidden;border:1px solid #2a2a33;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.shot img{display:block;width:100%}
</style></head><body><div class="glow"></div>
<div class="left"><div class="brand"><img src="../../site/icon.svg"><b>Fastcord</b></div>
<h1>Discord,<br><span>native.</span></h1>
<p>A fast, tiny Discord client.<br>No browser inside.</p></div>
<div class="shot"><img src="../../site/screenshot.jpg"></div>
</body></html>
