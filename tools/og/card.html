<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0d0d10;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif}
.glow{position:absolute;inset:0;background:radial-gradient(700px 520px at 8% 10%,rgba(88,101,242,.38),transparent 62%),radial-gradient(800px 600px at 85% 110%,rgba(88,101,242,.22),transparent 60%)}
.left{position:absolute;left:60px;top:0;bottom:0;width:360px;display:flex;flex-direction:column;justify-content:center;color:#f2f3f5}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.brand img{width:60px;height:60px}
.brand b{font-size:36px;letter-spacing:-.02em}
h1{font-size:64px;line-height:1;margin:0 0 22px;letter-spacing:-.04em;font-weight:800}
h1 span{color:#8a93ff}
p{font-size:25px;line-height:1.35;color:#a3a6b0;margin:0}
.shot{position:absolute;left:452px;top:66px;width:820px;border-radius:14px;overflow:hidden;border:1px solid #2c2c36;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 6px rgba(255,255,255,.03)}
.shot img{display:block;width:100%}
</style></head><body><div class="glow"></div>
<div class="left"><div class="brand"><img src="../../site/icon.svg"><b>Fastcord</b></div>
<h1>Chat,<br><span>native.</span></h1>
<p>A fast, tiny client<br>for Discord.<br>No browser inside.</p></div>
<div class="shot"><img src="../../site/screenshot.jpg"></div>
</body></html>
