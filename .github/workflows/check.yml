# Debug build plus every unit test on macOS and Windows. Runs on pushes and pull requests to main,
# and release.yml calls it first: no release is packaged unless this passes on the tagged commit.
name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (default: the triggering ref)"
        type: string
        required: false
        default: ""

env:
  ODIN_VERSION: dev-2026-10

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Odin ${{ env.ODIN_VERSION }} (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          curl -fsSL -o odin.tar.gz "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-arm64-$ODIN_VERSION.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf odin.tar.gz -C "$RUNNER_TEMP/odin"
          ODIN_DIR="$(dirname "$(find "$RUNNER_TEMP/odin" -type f -name odin -perm -u+x | head -1)")"
          echo "$ODIN_DIR" >> "$GITHUB_PATH"
          if ! "$ODIN_DIR/odin" version; then
            # The release binary links against Homebrew's LLVM.
            brew install llvm@20 || brew install llvm
            "$ODIN_DIR/odin" version
          fi

      - name: Install Odin ${{ env.ODIN_VERSION }} (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          curl -fsSL -o odin.zip "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-windows-amd64-$ODIN_VERSION.zip"
          mkdir -p "$RUNNER_TEMP/odin" && unzip -q odin.zip -d "$RUNNER_TEMP/odin"
          ODIN_DIR="$(dirname "$(find "$RUNNER_TEMP/odin" -type f -name odin.exe | head -1)")"
          cygpath -w "$ODIN_DIR" >> "$GITHUB_PATH"
          "$ODIN_DIR/odin.exe" version

      - name: Debug build
        run: ./build.sh debug

      - name: Unit tests
        env:
          FASTCORD_CI: "1"
        run: tests/run_all.sh
