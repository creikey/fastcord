# Monthly: checks the vendored libraries against upstream releases and OSV.dev (tools/vendor_check.py) and
# opens an issue when one is behind or has an advisory, unless an open one already says so.
name: Vendor check

on:
  schedule:
    - cron: "41 7 3 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Check and open an issue
        run: |
          python3 -I tools/vendor_check.py > report.txt && exit 0
          cat report.txt
          title="Vendor: libraries behind upstream or with advisories"
          if [ -n "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then exit 0; fi
          { echo 'From `python3 -I tools/vendor_check.py` (update the library, its README and `- Upstream:` line):'; echo; echo '```'; cat report.txt; echo '```'; } > body.md
          gh issue create --title "$title" --body-file body.md
