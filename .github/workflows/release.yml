# Release = push a tag:  git tag v0.1.0 && git push origin v0.1.0
# CI builds and tests, creates the GitHub release for the tag (if it doesn't
# exist yet) and attaches the binaries. Publishing a release by hand in the
# GitHub UI works too. The site links to releases/latest/download/<asset>.
name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  ODIN_VERSION: dev-2026-10

jobs:
  # Debug build and unit tests on the tagged commit; packaging only runs if they pass.
  check:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

      - name: Install Odin ${{ env.ODIN_VERSION }}
        run: |
          set -e
          curl -fsSL -o odin.tar.gz "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-macos-arm64-$ODIN_VERSION.tar.gz"
          mkdir -p "$RUNNER_TEMP/odin" && tar -xzf odin.tar.gz -C "$RUNNER_TEMP/odin"
          ODIN_DIR="$(dirname "$(find "$RUNNER_TEMP/odin" -type f -name odin -perm -u+x | head -1)")"
          echo "$ODIN_DIR" >> "$GITHUB_PATH"
          if ! "$ODIN_DIR/odin" version; then
            # The release binary links against Homebrew's LLVM.
            brew install llvm@20 || brew install llvm
            "$ODIN_DIR/odin" version
          fi

      - name: Package
        run: scripts/package_macos.sh "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"

      # Developer ID signing + notarization. Runs only when the Apple secrets are set
      # (see README "macOS signing"); otherwise the ad-hoc signed build ships as is.
      - name: Sign and notarize
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        if: ${{ env.MACOS_CERT_P12_BASE64 != '' }}
        run: scripts/notarize_macos.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Fastcord $TAG" --generate-notes
          gh release upload "${{ github.event.release.tag_name || inputs.tag || github.ref_name }}" dist/fastcord-macos.zip --clobber

  # Windows and Linux backends are not finished yet. When they are, add jobs here
  # that upload fastcord-windows.zip (single fastcord.exe) and fastcord-linux.tar.gz.
