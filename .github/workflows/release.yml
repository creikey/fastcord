# Publishes a release when a human asks: gh workflow run release.yml -f version=v0.5.0 (tags the chosen commit).
# The release stays a draft until the Mac, Windows and Linux archives are all uploaded and have each started
# headless (the smoke tests in ci-build.yml and smoke-linux below), so the site's
# releases/latest links and the app's Update pill never see a release with missing downloads.
name: Release

on:
  workflow_dispatch:
    inputs:
      version: { description: "Version tag, e.g. v0.5.0 (created at the chosen commit)", required: true }

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Draft release
        run: |
          case "$VERSION" in v*) ;; *) echo "version must look like v0.5.0"; exit 1;; esac
          # Notes from commit titles since the last tag: fastcord lands on main without pull requests.
          python3 -I tools/release_notes.py "$VERSION" > notes.md
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md

  windows-linux:
    needs: draft
    uses: ./.github/workflows/ci-build.yml
    with: { os: windows-latest, jai: jai.exe, release: "${{ needs.draft.outputs.version }}" }
    secrets: inherit

  macos:
    needs: draft
    uses: ./.github/workflows/ci-build.yml
    with: { os: macos-latest, jai: jai-macos, release: "${{ needs.draft.outputs.version }}" }
    secrets: inherit

  # The Linux binary is cross-built on Windows, so it first runs here: unpacked from the draft's archive on a
  # clean Ubuntu (Mesa's software OpenGL), headless on the chat fixture. A crash or a blank frame stops the publish.
  smoke-linux:
    needs: windows-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test the Linux archive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri libfontconfig1
          mkdir -p build/smoke
          gh release download "$VERSION" -p fastcord-linux-x86_64.tar.gz -D build/smoke
          tar -xzf build/smoke/fastcord-linux-x86_64.tar.gz -C build/smoke
          build/smoke/fastcord/fastcord -shot:build/smoke/shot.png -fixture:tests/ui/chat.jsonl -channel:1546820603343016006 -now:1793016000 -dpi:1
          python3 -I tools/smoke_check.py build/smoke/shot.png

  publish:
    needs: [draft, windows-linux, macos, smoke-linux]
    runs-on: ubuntu-latest
    env:
      UPDATE_KEY: ${{ secrets.FASTCORD_UPDATE_KEY }}
    steps:
      # The in-app updater's manifest: each archive's SHA-256, signed with the release key (an Ed25519 PEM in
      # the FASTCORD_UPDATE_KEY secret; src/selfupdate pins its public half). Without the secret only the
      # unsigned checksums go up, and the app's Update pill opens the download page instead of installing.
      - name: Update manifest
        run: |
          set -euo pipefail
          umask 077
          mkdir -p m
          cd m
          gh release download "$VERSION" -p fastcord-macos.zip -p fastcord-windows.zip -p fastcord-linux-x86_64.tar.gz
          { echo "fastcord-update $VERSION"; sha256sum fastcord-macos.zip fastcord-windows.zip fastcord-linux-x86_64.tar.gz; } > fastcord-update.txt
          cat fastcord-update.txt
          files=fastcord-update.txt
          if [ -n "$UPDATE_KEY" ]; then
            printf '%s\n' "$UPDATE_KEY" > key.pem
            openssl pkeyutl -sign -inkey key.pem -rawin -in fastcord-update.txt -out fastcord-update.sig
            rm key.pem
            files="$files fastcord-update.sig"
          else
            echo "::notice::FASTCORD_UPDATE_KEY isn't set, so this release can't be installed from the app"
          fi
          gh release upload "$VERSION" $files --clobber

      - name: Publish release
        run: gh release edit "$VERSION" --draft=false --latest
