# Daily: record the Electron and Chrome of every Discord desktop host the updater serves (site/hosts.json),
# which fastcord reads at launch to report the host its install would run (tools/host_versions.py).
name: Host versions

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: host-versions

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install brotli==1.1.0
      - run: python3 -I tools/host_versions.py site/hosts.json
      - name: Commit if changed
        run: |
          git diff --quiet site/hosts.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/hosts.json
          git commit -m "Hosts: Record the desktop hosts Discord serves"
          git pull --rebase origin main
          git push origin HEAD:main
