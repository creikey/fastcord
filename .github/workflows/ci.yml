# Builds fastcord on Windows first, then macOS and Linux once Windows passes. Runs only by hand
# (gh workflow run ci.yml); releases go through release.yml.
# Jai is private: it comes from ci/jai-server (Fly.io) with the JAI_PASSWORD secret, is unpacked outside the
# checkout, and must never be uploaded, cached or echoed. Fork pull requests get no secrets, so they skip the build.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    uses: ./.github/workflows/ci-build.yml
    with: { os: windows-latest, jai: jai.exe }
    secrets: inherit

  macos:
    needs: windows
    uses: ./.github/workflows/ci-build.yml
    with: { os: macos-latest, jai: jai-macos }
    secrets: inherit

  linux:
    needs: windows
    uses: ./.github/workflows/ci-build.yml
    with: { os: ubuntu-latest, jai: jai-linux }
    secrets: inherit
